[project]
name = "atlas-pipeline"
version = "0.1.0"
description = "Offline pipeline for the Acral Melanoma Spatial Atlas: raw sources -> canonical dataset -> static assets"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "numpy>=2.0,<2.3",
  "pandas>=2.2,<2.4",
  "pyarrow>=17",
  "scipy>=1.13",
  "h5py>=3.11",
  "anndata>=0.10",
  "scanpy>=1.10",
  "umap-learn>=0.5.6",
  "scikit-learn>=1.5",
  "scikit-image>=0.24",
  "tifffile>=2024.8.10",
  "imagecodecs>=2024.6.1",
  "zarr>=3.0",
  "opencv-python-headless>=4.10",
  "pillow>=10.4",
  "pandera>=0.20",
  "pydantic>=2.8",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "pandas-stubs>=2.2",
  "types-requests",
  "spatialdata-io>=0.7.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline/atlas_pipeline"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["pipeline", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["pipeline/atlas_pipeline"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["scipy.*", "h5py.*", "anndata.*", "scanpy.*", "sklearn.*", "skimage.*", "tifffile.*", "zarr.*", "cv2.*", "pandera.*", "pyarrow.*", "umap.*", "imagecodecs.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["pipeline/tests"]
markers = ["data: needs $DATA_ROOT with the ovarian-10x raw data and built assets"]
addopts = "-ra"
filterwarnings = ["ignore:.*encountered in matmul:RuntimeWarning", "ignore::FutureWarning"]

[tool.coverage.run]
source = ["atlas_pipeline"]
branch = false

[tool.coverage.report]
show_missing = true
skip_covered = true
